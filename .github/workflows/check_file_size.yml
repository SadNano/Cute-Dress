# Check File Size
#
# 仅在 PR 为图片提交时检查变更图片是否均 <= 1 MiB
# 超限时只让检查失败; 评论由 comment_file_size.yml 的 workflow_run 处理
#
# 检查 pr-type (PR body 中的 <!-- pr-type: xxx -->):
#   - images (或缺省无标签) -> 执行检查
#   - ci_wf / docs / others  -> 跳过, 不 fail
# 无变更图片时跳过, 不 fail (无图提醒交给 check_pr_content)
#
# 脚本内重要常量:
#   MAX_SIZE         1024 * 1024 (1 MiB)
#   IMAGE_EXT        认定的图片后缀; 只对这些文件查大小
#   ACTIVE_STATUSES  只检查 added / modified / renamed / copied
#   PR_TYPE_RE       解析 pr-type 标签
#
name: Check File Size

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-size:
    runs-on: ubuntu-latest
    steps:
      - name: Check file sizes
        uses: actions/github-script@v7
        with:
          script: |
            const MAX_SIZE = 1024 * 1024; // 1 MiB
            const IMAGE_EXT = /\.(jpe?g|jfif|png|webp|tiff?|hei[cf]|avif|gif|bmp)$/i;
            const ACTIVE_STATUSES = new Set(['added', 'modified', 'renamed', 'copied']);
            const PR_TYPE_RE = /<!--\s*pr-type:\s*(\S+)\s*-->/;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Missing pull_request payload.');
              return;
            }

            const typeMatch = (pr.body || '').match(PR_TYPE_RE);
            const prType = typeMatch ? typeMatch[1] : 'images';

            if (prType !== 'images') {
              core.info(`pr-type is "${prType}", skip file size check.`);
              return;
            }

            let files = [];
            let page = 1;
            while (true) {
              const compare = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${pr.base.sha}...${pr.head.sha}`,
                per_page: 100,
                page,
              });

              const pageFiles = compare.data.files || [];
              if (pageFiles.length === 0) break;

              files.push(...pageFiles);
              if (pageFiles.length < 100) break;
              page++;
            }

            const images = files.filter(file =>
              ACTIVE_STATUSES.has(file.status) && IMAGE_EXT.test(file.filename)
            );
            if (images.length === 0) {
              core.info('No changed images found, skip file size check.');
              return;
            }

            const oversized = [];
            for (const file of images) {
              try {
                const encodedPath = file.filename.split('/').map(encodeURIComponent).join('/');
                const rawUrl = `https://raw.githubusercontent.com/${encodeURIComponent(pr.head.repo.owner.login)}/${encodeURIComponent(pr.head.repo.name)}/${pr.head.sha}/${encodedPath}`;
                const response = await fetch(rawUrl, { signal: AbortSignal.timeout(30_000) });
                if (!response.ok) throw new Error(`Download returned ${response.status}`);

                let size = 0;
                const reader = response.body.getReader();
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  size += value.byteLength;
                  if (size > MAX_SIZE) {
                    await reader.cancel();
                    break;
                  }
                }
                if (size > MAX_SIZE) {
                  oversized.push(`- ${file.filename} (> ${MAX_SIZE} bytes)`);
                }
              } catch (error) {
                core.setFailed(`Unable to inspect ${file.filename}: ${error.message}`);
                return;
              }
            }

            if (oversized.length > 0) {
              core.info(`Oversized image(s):\n${oversized.join('\n')}`);
              core.setFailed('File size check failed');
            } else {
              core.info('All changed images are under 1 MiB.');
            }
