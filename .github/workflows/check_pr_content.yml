# Check PR content without writing to the PR.
name: Check PR Content

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-content-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default-branch check logic
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check PR content
        uses: actions/github-script@v7
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/check_pr_content`);
            await run({ github, context, core, mode: 'check' });
