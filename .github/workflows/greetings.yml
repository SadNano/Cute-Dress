name: Greetings

on:
  workflow_run:
    workflows: [PR Opened Signal]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: first-pr-greeting-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  greeting:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted default-branch greeting logic
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Greet first-time contributor
        uses: actions/github-script@v7
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/greet_first_interaction`);
            await run({ github, context, core });
