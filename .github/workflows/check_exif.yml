# Check changed PR images for high-sensitivity EXIF without writing to the PR.
name: Check Image EXIF Data

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: exif-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-exif:
    runs-on: ubuntu-latest
    steps:
      - name: Install exiftool
        run: |
          command -v exiftool && exit 0
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl \
            || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libimage-exiftool-perl)

      - name: Checkout trusted default-branch check logic
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check EXIF in changed images
        uses: actions/github-script@v8
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/check_exif`);
            await run({ github, context, core, mode: 'check' });
